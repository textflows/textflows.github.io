name: Supabase wach halten
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anfragen
        run: |
          for i in 1 2 3 4 5; do
            curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST "https://fobhvcowzyrtqqofkxqn.supabase.co/rest/v1/rpc/ping" \
              -H "apikey: sb_publishable_hn3lWXR6HOT5tj_OPRBh1g_0fvt8abh" \
              -H "Content-Type: application/json" -d '{}'
            echo
            sleep 5
          done
      - name: Zeitplan aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable supabase-wach.yml --repo "$GITHUB_REPOSITORY"
